name: yingyeothon_logger
description: Structured logger with a live severity threshold for the yyt client libraries. Context is a JSON object so any writer can render it.
version: 0.1.0
# Installed by git dependency; nothing is on pub.dev (rules/release.md).
publish_to: none
repository: https://github.com/yingyeothon/flutterlib
resolution: workspace
environment:
  sdk: ^3.13.0
dependencies:
  yingyeothon_codec:
    path: ../yingyeothon_codec
dev_dependencies:
  test: ^1.31.0
