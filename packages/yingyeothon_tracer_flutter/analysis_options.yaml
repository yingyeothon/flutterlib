# The Flutter package resolves on its own (not a workspace member), so it
# carries the root's rules with Flutter's lints in place of package:lints.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    public_member_api_docs: error

linter:
  rules:
    - public_member_api_docs
    - prefer_single_quotes
    - avoid_print
    - always_declare_return_types
    - unawaited_futures
    - directives_ordering
    - prefer_final_locals
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
