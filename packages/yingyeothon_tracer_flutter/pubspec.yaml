name: yingyeothon_tracer_flutter
description: Flutter glue for yyt tracer - screenshots, view hierarchy, lifecycle, navigation and error breadcrumbs, and a debug-only report button over yingyeothon_tracer_client.
version: 0.3.1
# Installed by git dependency; nothing is on pub.dev (rules/release.md).
# The one Flutter package: outside the pub workspace, like the example, so
# the root gate needs only the Dart SDK (rules/tooling.md).
publish_to: none
repository: https://github.com/yingyeothon/flutterlib
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^10.2.2
  yingyeothon_logger:
    path: ../yingyeothon_logger
  yingyeothon_tracer_client:
    path: ../yingyeothon_tracer_client
dev_dependencies:
  device_info_plus_platform_interface: ^8.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
