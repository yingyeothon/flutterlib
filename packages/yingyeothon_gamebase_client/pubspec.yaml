name: yingyeothon_gamebase_client
description: Client SDK for the yyt realtime gateway - lobby (positions, chat, parties) and dungeon (q) channels with reconnect, backoff and a peer map.
version: 0.1.0
# Installed by git dependency; nothing is on pub.dev (rules/release.md).
publish_to: none
repository: https://github.com/yingyeothon/flutterlib
resolution: workspace
environment:
  sdk: ^3.13.0
dependencies:
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  yingyeothon_codec:
    path: ../yingyeothon_codec
  yingyeothon_logger:
    path: ../yingyeothon_logger
dev_dependencies:
  fake_async: ^1.3.3
  test: ^1.31.0
  yingyeothon_fake_gateway:
    path: ../yingyeothon_fake_gateway
