name: yingyeothon_tracer_client
description: Pure Dart client for yyt tracer, the debug-data collector - breadcrumbs, logs, reports with screenshots and feedback over its envelope ingest. No Sentry dependency.
version: 0.2.0
# Installed by git dependency; nothing is on pub.dev (rules/release.md).
publish_to: none
repository: https://github.com/yingyeothon/flutterlib
resolution: workspace
environment:
  sdk: ^3.13.0
dependencies:
  http: ^1.6.0
  yingyeothon_logger:
    path: ../yingyeothon_logger
dev_dependencies:
  test: ^1.31.0
  fake_async: ^1.3.3
