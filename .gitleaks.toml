# gitleaks config (v8 syntax). Default rules plus the credential-assignment rule the
# sibling `service` and `csharplib` repos use, so a leak is caught the same way in
# every yyt repository.
#
# This repository has no infrastructure and needs no credentials: it is Dart
# packages, their tests and a Flutter example. So the rule here is not "redact the
# secrets we keep" — it is "nothing of that shape should ever exist", and every
# allowlist entry below is a test fixture that is obviously not a credential.
title = "yyt flutterlib"

[extend]
useDefault = true

[[rules]]
id = "yyt-credential-assignment"
description = "Credential-looking assignment (PASSWORD/SECRET/TOKEN/KEY = long literal on the same line)"
regex = '''(?i)(?:password|secret|token|api[_-]?key|debug[_-]?key)[ \t]*[=:][ \t]*["']?([A-Za-z0-9+/=_\-]{16,})["']?'''
secretGroup = 1
entropy = 3.0
[rules.allowlist]
regexTarget = "line"
regexes = [
  '''(?i)(placeholder|example|changeme|xxx+|\$\{|<[a-z-]+>)''',
  # Dart named argument fed from an identifier, not a literal: `token: options.token,`
  # or `token: jwt)`. At most one `.`/`?.` member hop, so a three-part JWT written
  # unquoted (`eyJ….eyJ….sig`) does not qualify.
  '''(?i)token[ \t]*:[ \t]*[a-z_][A-Za-z0-9_]{0,40}(\?\.[a-z_][A-Za-z0-9_]{0,40}|\.[a-z_][A-Za-z0-9_]{0,40})?[ \t]*(,|\)|$)''',
  # A member reference, not a value: `Token = token;`, `key: this.key,`. One hop, no
  # dotted chains, so a dotted secret is not admitted.
  '''[=:][ \t]*[A-Za-z_][A-Za-z0-9_]{0,40}(\.[A-Za-z_][A-Za-z0-9_]{0,40})?[ \t]*[;,)]''',
]

# An encrypted asset bundle's key in its text form (the service repository's
# docs/asset-encryption.md): `yak1.` + 43 base64url characters. Readable by the
# bundle's team and meant to ship inside an app, never inside this repository.
# The one allowed value is the service's test-vector key (bytes
# 0123456789abcdef x4) in that form, which the conformance fixture carries.
[[rules]]
id = "yyt-asset-bundle-key"
description = "Encrypted asset bundle key (yak1.<43 base64url>)"
regex = '''yak1\.[A-Za-z0-9_-]{43}'''
[rules.allowlist]
regexes = ['''yak1\.ASNFZ4mrze8BI0VniavN7wEjRWeJq83vASNFZ4mrze8''']

[allowlist]
description = "Config itself and the deliberately fake fixtures"
paths = ['''\.gitleaks\.toml$''']
# The test suites use "eyJ.secret-token.sig": three dot-separated words that look
# like a JWT to a human and are not one. The tests that assert the token never
# reaches a log line need a literal to search for, so it has to be in the source.
# "0123456789abcdef" is the shared non-secret channel-id fixture of every yyt repo.
# "yak1.ASNF…" is the same bytes in the asset-key text form (the service's test
# vectors); the default generic-api-key rule matches it too, so it is allowed here
# by exact value as well as in the yak1 rule above.
regexes = [
  '''eyJ\.secret-token\.sig''',
  '''(0123456789abcdef){1,4}''',
  '''yak1\.ASNFZ4mrze8BI0VniavN7wEjRWeJq83vASNFZ4mrze8''',
]
